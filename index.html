<!doctype html>
<html lang="ru" class="site-loading">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#20362f" />
    <meta name="description" content="Два инвестиционных участка у реки в Речкуновской зоне отдыха. 5,5 га под курорт и оздоровление, 8,5 га под жилую застройку. Продуктовые концепции и условия реализации." />
    <link rel="preload" href="/fonts/nimbus-sans-regular.otf" as="font" type="font/otf" crossorigin />
    <title>Речкуновская зона отдыха — инвестиционные участки у реки</title>
    <style>
      html.site-loading{background:#fff}html.site-loading body{overflow:hidden}
      html.site-loading #root{visibility:hidden}
      #site-loader{position:fixed;inset:0;z-index:1000;display:grid;place-items:center;background:#fff;color:#20362f;font:400 40px/1.2 Arial,sans-serif;transition:opacity 180ms ease}
      #site-loader.is-finished{opacity:0;pointer-events:none}
      #site-loader-status{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
      @media(prefers-reduced-motion:reduce){#site-loader{transition:none}}
    </style>
    <script>
      window.siteLoader={started:performance.now(),progress:0,set(value){this.progress=Math.max(this.progress,Math.min(100,value));const label=document.getElementById('site-loader-percent');if(label)label.textContent=this.progress+'%';},finish(){if(this.finished)return;this.finished=true;clearTimeout(this.timeout);this.set(100);setTimeout(()=>requestAnimationFrame(()=>requestAnimationFrame(()=>{document.documentElement.classList.remove('site-loading');const loader=document.getElementById('site-loader');loader?.classList.add('is-finished');setTimeout(()=>loader?.remove(),200);})),Math.max(120,500-(performance.now()-this.started)));}};
      window.siteLoader.timeout=setTimeout(()=>{if(document.getElementById('root')?.hasChildNodes())window.siteLoader.finish();else{const label=document.getElementById('site-loader-percent');if(label){label.textContent='Не удалось загрузить сайт';label.style.fontSize='18px';const retry=document.createElement('button');retry.textContent='Повторить';retry.onclick=()=>location.reload();label.append(document.createElement('br'),retry);}}},15000);
    </script>
  </head>
  <body class="type-body">
    <div id="site-loader" role="status" aria-live="polite" aria-label="Загрузка сайта"><span id="site-loader-percent" aria-hidden="true">0%</span><span id="site-loader-status">Загрузка сайта</span></div>
    <div id="root"></div>
    <noscript><style>#site-loader{display:none}html.site-loading #root{visibility:visible}</style>Для просмотра сайта включите JavaScript.</noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
